# رلهٔ تلگرام سه پروژه (RESANE.md بخش ۴-الف). صف روی سرور هر پروژه است؛ این گردش‌کار فقط می‌خواند، به تلگرام می‌فرستد
# زمان‌بند هر ۱۵ دقیقه فقط در پنجره‌های انتشار تهران (UTC+3:30):
#   ۰۸:۳۰ تا ۰۹:۱۵ تهران = ۰۵:۰۰ تا ۰۵:۴۵ UTC  (صبح بازار سیمان‌باز ۰۸:۳۰؛ از ۲۸ مهر ۱۴۰۵، طرح کانال v3)
#   ۱۰:۳۰ تا ۱۱:۱۵ تهران = ۰۷:۰۰ تا ۰۷:۴۵ UTC  (پرسش روز سیمان‌باز ۱۰:۳۰؛ از ۲۵ مهر ۱۴۰۵)
#   ۱۱:۳۰ تا ۱۲:۱۵ تهران = ۰۸:۰۰ تا ۰۸:۴۵ UTC  (پرسش روز آهن‌حساب ۱۱:۳۰؛ از ۲۹ مهر ۱۴۰۵، پیش از آن در هیچ پنجره نبود)
#   ۱۳:۳۰ تا ۱۵:۱۵ تهران = ۱۰:۰۰ تا ۱۱:۴۵ UTC  (کارت قیمت ۱۳:۳۰)
#   ۱۷:۳۰ تا ۱۹:۱۵ تهران = ۱۴:۰۰ تا ۱۵:۴۵ UTC  (گزارش خبری ۱۷:۳۰)
# زمان‌بند گیت‌هاب ۵ تا ۳۰ دقیقه دیر می‌کند و گاهی نوبتی را جا می‌اندازد؛ برای همین چند نوبت پیاپی.
# برآورد دقیقه (KOLLI بخش ۵): ۲۸ اجرا در روز (از ۲۹ مهر با پنجرهٔ ۱۱:۳۰) × یک job هر پروژه × ۱ دقیقه × ۳۰ ≈ ۸۴۰ دقیقه در ماه برای هر پروژه (سه پروژه ≈ ۲۵۲۰)؛
# بیش از بودجهٔ مخزن‌های خصوصی (DEPLOY.md بخش ۱-الف)، پس این مخزن عمومی است و از ۲۰۰۰ دقیقهٔ مشترک نمی‌خورد.
# زنده نگه داشتن (۲۶ مهر ۱۴۰۵): گیت‌هاب زمان‌بند مخزن عمومی را پس از ۶۰ روز بی کامیت خاموش می‌کند و تلگرام هر سه پروژه بی‌صدا
# می‌خوابد؛ پس روز اول هر ماه همین گردش‌کار با رابط گیت‌هاب خودش را دوباره فعال می‌کند (روش keepalive-workflow، بی کامیت). یک گام چندثانیه‌ای.
# رازهای هر پروژه با پیشوند نام بزرگ‌شدهٔ آن: <P>_SITE، <P>_RELE_KEY، <P>_TELEGRAM_TOKEN، <P>_TELEGRAM_CHANNEL.
name: rele

on:
  schedule:
    - cron: "*/15 5 * * *"
    - cron: "*/15 7 * * *"
    - cron: "*/15 8 * * *"
    - cron: "*/15 10-11 * * *"
    - cron: "*/15 14-15 * * *"
  workflow_dispatch:
  # تلنگر از سرور هر پروژه پس از ساختن پست (۲۸ مهر ۱۴۰۵؛ زمان‌بند بالا ۲۷ مهر از ~۲۰ نوبت فقط سه بار اجرا شد):
  # POST /repos/soroush68/resane-rele/dispatches با event_type نام پروژه؛ چند دقیقه بعد تلگرام. زمان‌بند پشتیبان می‌ماند.
  repository_dispatch:
    types: [simanbaz, ahanhesab, melkdan, kharidkar]

permissions:
  contents: read
  actions: write   # فقط برای گام «زنده نگه داشتن» پایین

concurrency:
  group: rele
  cancel-in-progress: false

jobs:
  rele:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # زمان‌بند همهٔ پروژه‌های فهرست پایان سطر بعد («["SIMANBAZ","AHANHESAB"]»؛ آهن‌حساب از ۲۸ مهر ۱۴۰۵) را می‌زند؛ تلنگر (repository_dispatch) فقط پروژهٔ فرستنده را، تا هر پست یک کار بخورد.
        # پروژهٔ تازه: نامش را به همان فهرست بیفزا (پس از ساخت کانال و رازهای <نام>_SITE، _RELE_KEY، _TELEGRAM_TOKEN، _TELEGRAM_CHANNEL).
        p: ${{ fromJSON(github.event_name == 'repository_dispatch' && format('["{0}"]', fromJSON('{"simanbaz":"SIMANBAZ","ahanhesab":"AHANHESAB","melkdan":"MELKDAN","kharidkar":"KHARIDKAR"}')[github.event.action]) || '["SIMANBAZ","AHANHESAB"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: فرستادن صف تلگرام
        env:
          SITE: ${{ secrets[format('{0}_SITE', matrix.p)] }}
          RELE_KEY: ${{ secrets[format('{0}_RELE_KEY', matrix.p)] }}
          TELEGRAM_TOKEN: ${{ secrets[format('{0}_TELEGRAM_TOKEN', matrix.p)] }}
          TELEGRAM_CHANNEL: ${{ secrets[format('{0}_TELEGRAM_CHANNEL', matrix.p)] }}
          PYTHONIOENCODING: utf-8
        run: python rele.py
      - name: زنده نگه داشتن زمان‌بند (روز اول ماه)
        if: always() && strategy.job-index == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/rele.yml/enable" && echo "زمان‌بند دوباره فعال شد"
          fi
